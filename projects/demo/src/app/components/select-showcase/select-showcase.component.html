<h2>MerSelect Component</h2>

<div class="tabs">
  @for (tab of tabs; track tab) {
    <button
      [class.active]="activeTab === tab.id"
      (click)="setTab(tab.id)">
      {{ tab.title }}
    </button>
  }
</div>

<div class="example-container">
  @switch (activeTab) {
    <!-- Basic Usage -->
    @case ('basic') {
      <div class="example">
        <app-select-basic-showcase></app-select-basic-showcase>
      </div>
    }
    <!-- Object Selection -->
    @case ('objects') {
      <div class="example">
        <app-select-objects-showcase></app-select-objects-showcase>
      </div>
    }
    <!-- Multiple Selection -->
    @case ('multiple') {
      <div class="example">
        <app-select-multi-showcase></app-select-multi-showcase>
      </div>
    }
    <!-- Component States -->
    @case ('states') {
      <div class="example">
        <app-select-states-showcase></app-select-states-showcase>
      </div>
    }
    <!-- Custom Templates -->
    @case ('custom') {
      <div class="example">
        <app-select-custom-template-showcase></app-select-custom-template-showcase>
      </div>
    }
    @case ('material') {
      <div class="example">
        <app-select-material-showcase></app-select-material-showcase>
      </div>
    }
  }
</div>
